name: BTC AI Auto Trader
on:
  schedule:
    - cron: '*/5 * * * *' # Tự động chạy mỗi 5 phút một lần
  workflow_dispatch: # Cho phép anh bấm nút chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Brain
        run: python btc_ai.py
