<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTC AI BINANCE PRO - Smart AI TP/SL</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#0b0e11;overflow:hidden;color:#aaaaaa;}
.container{display:flex;height:100vh;}
#chart{flex:3;}
.right{flex:1;display:grid;grid-template-rows:repeat(35,1fr);gap:6px;padding:8px;background:#0b0e11;}
.box{background:#161a1e;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:0.2s;overflow:hidden;position:relative;padding:2px 6px;}
.green{color:#0ecb81;}
.red{color:#f6465d;}
.yellow{color:#fcd535;}
.gray-number{color:#aaaaaa;margin-left:4px;}
.tooltip{visibility:hidden;width:auto;max-width:220px;background:#222;color:#fff;text-align:left;border-radius:4px;padding:4px 6px;position:absolute;z-index:10;top:110%;left:50%;transform:translateX(-50%);font-size:12px;white-space:pre-line;}
.box:hover .tooltip{visibility:visible;}
.rec-bar{height:10px;width:100%;border-radius:5px;background:#222;position:relative;}
.rec-fill{height:100%;border-radius:5px;position:absolute;left:0;top:0;text-align:right;color:#fff;font-size:10px;padding-right:3px;line-height:10px;}
.conf-bar{height:16px;width:100%;border-radius:6px;background:#222;position:relative;margin-top:2px;}
.conf-fill{height:100%;border-radius:6px;position:absolute;left:0;top:0;text-align:right;color:#fff;font-size:12px;padding-right:4px;line-height:16px;font-weight:bold;}
@keyframes flashPrice{0%{background:#0ecb81;color:#000}50%{background:#161a1e;color:#0ecb81}100%{background:#0b0e11;color:#0ecb81}}
@keyframes flashRed{0%{background:#f6465d;color:#000}50%{background:#161a1e;color:#f6465d}100%{background:#0b0e11;color:#f6465d}}
.flash-price{animation:flashPrice 0.5s;}
.flash-red{animation:flashRed 0.5s;}
.mini-bar{height:10px;border-radius:3px;margin:1px 0;}
</style>
</head>
<body>
<div class="container">
  <div id="chart"></div>
  <div class="right">
    <div class="box" id="price"></div>
    <div class="box" id="trend"></div>
    <div class="box" id="rsi"></div>
    <div class="box" id="macd"></div>
    <div class="box" id="atr"></div>
    <div class="box" id="stoch"></div>
    <div class="box" id="volume"></div>
    <div class="box" id="pattern"></div>
    <div class="box" id="recommend"></div>
    <div class="box" id="aiPredict"></div>
    <div class="box rec-bar"><div id="recFill" class="rec-fill"></div></div>
    <div class="box green" id="actionBuy"></div>
    <div class="box green" id="entryBuy"></div>
    <div class="box yellow" id="tpBuy"></div>
    <div class="box yellow" id="slBuy"></div>
    <div class="box green" id="winBuy"></div>
    <div class="box conf-bar"><div id="confBuy" class="conf-fill"></div></div>
    <div class="box red" id="actionSell"></div>
    <div class="box red" id="entrySell"></div>
    <div class="box yellow" id="tpSell"></div>
    <div class="box yellow" id="slSell"></div>
    <div class="box red" id="winSell"></div>
    <div class="box conf-bar"><div id="confSell" class="conf-fill"></div></div>
    <div class="box" style="flex-direction:column;justify-content:flex-start;padding:4px;" id="miniChart"></div>
    <div class="box" id="total"></div>
    <div class="box" id="winrate"></div>
    <div class="box" id="last"></div>
  </div>
</div>

<script>
// ===== TradingView Chart =====
new TradingView.widget({
  container_id:"chart",
  symbol:"BINANCE:BTCUSDT",
  interval:"1",
  theme:"dark",
  autosize:true
});

// ===== Helper Functions =====
async function getData(tf){
  let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=100`);
  return await r.json();
}
function closes(d){return d.map(x=>parseFloat(x[4]));}
function volumes(d){return d.map(x=>parseFloat(x[5]));}
function MA(data, n){return data.slice(-n).reduce((a,b)=>a+b)/n;}
function ATR(data,n=14){
  let trs=[];for(let i=1;i<data.length;i++){
    let h=parseFloat(data[i][2]),l=parseFloat(data[i][3]),c=parseFloat(data[i-1][4]);
    trs.push(Math.max(h-l,Math.abs(h-c),Math.abs(l-c)));
  }
  return trs.slice(-n).reduce((a,b)=>a+b)/n;
}
function RSI(data,n=14){
  let gains=0,losses=0;
  for(let i=data.length-n;i<data.length;i++){
    let d=data[i]-data[i-1];if(d>0)gains+=d;else losses-=d;
  }
  return 100-(100/(1+gains/losses));
}
function MACD(data){
  let ema=(d,p)=>{let k=2/(p+1),v=d[0];for(let i=1;i<d.length;i++){v=d[i]*k+v*(1-k);}return v;}
  let fast=ema(data.slice(-12),12),slow=ema(data.slice(-26),26); return fast-slow;
}
function StochRSI(data,n=14){
  let min=Math.min(...data.slice(-n)),max=Math.max(...data.slice(-n)),cl=data[data.length-1];
  return (cl-min)/(max-min)*100;
}
function detectPattern(d){
  let o=parseFloat(d[d.length-1][1]),h=parseFloat(d[d.length-1][2]),l=parseFloat(d[d.length-1][3]),cl=parseFloat(d[d.length-1][4]),body=Math.abs(cl-o),range=h-l;
  if(body/range<0.2)return"Doji 🔹"; if(body/range>0.7&&cl>o)return"Bull Hammer 🔥"; if(body/range>0.7&&cl<o)return"Bear Hammer 🔥"; return"-";
}
function flash(el,type){el.classList.remove('flash-price','flash-red');void el.offsetWidth;if(type)el.classList.add(type);}

// ===== AI Prediction - simple linear regression over last 10 closes =====
function aiPredict(closes){
  if(closes.length<10) return {signal:"HOLD",prob:0};
  let x=Array.from({length:10},(_,i)=>i);
  let y=closes.slice(-10);
  let meanX=x.reduce((a,b)=>a+b)/x.length;
  let meanY=y.reduce((a,b)=>a+b)/y.length;
  let num=0,den=0;
  for(let i=0;i<10;i++){num+=(x[i]-meanX)*(y[i]-meanY);den+=(x[i]-meanX)**2;}
  let slope=num/den;
  let prob=Math.min(Math.abs(slope)*2000,100);
  return {signal:slope>0?"BUY":slope<0?"SELL":"HOLD",prob};
}

// ===== State =====
let tradesBuy=[],tradesSell=[],history=[],lastPrice=null;

// ===== UI Update =====
function updateUI(price,trend,rsi,macd,atr,stoch,vol,pattern,ai){
  const p=document.getElementById.bind(document);
  if(lastPrice){if(price>lastPrice)flash(p("price"),'flash-price');else if(price<lastPrice)flash(p("price"),'flash-red');}lastPrice=price;
  p("price").innerText="💰 "+price.toFixed(2);
  p("trend").innerText="Trend: "+trend; p("trend").style.color=trend.startsWith("UP")?"#0ecb81":"#f6465d";
  p("rsi").innerText="RSI: "+rsi.toFixed(1);
  p("macd").innerText="MACD: "+macd.toFixed(2);
  p("atr").innerText="ATR: "+atr.toFixed(2);
  p("stoch").innerText="Stoch RSI: "+stoch.toFixed(1);
  p("volume").innerText="Vol: "+vol.toFixed(0);
  p("pattern").innerText=pattern;

  // Recommendation Score + AI
  let score=0;
  if(trend.startsWith("UP"))score+=30; else score-=30;
  if(rsi<40)score+=15; else if(rsi>60)score-=15;
  if(stoch<20)score+=10; else if(stoch>80)score-=10;
  if(macd>0)score+=20; else score-=20;
  if(vol>atr*10)score+=10;
  if(pattern.includes("Bull"))score+=10; if(pattern.includes("Bear"))score-=10;
  if(ai.signal=="BUY")score+=ai.prob*0.3; else if(ai.signal=="SELL")score-=ai.prob*0.3;

  let recTxt="WAIT",recColor="#aaaaaa";
  if(score>15){recTxt="BUY "+score.toFixed(0)+"%"; recColor="#0ecb81";}
  else if(score<-15){recTxt="SELL "+(-score).toFixed(0)+"%"; recColor="#f6465d";}
  p("recommend").innerText="Recommendation: "+recTxt; p("recommend").style.color=recColor;
  p("recFill").style.width=Math.min(Math.abs(score),100)+"%"; p("recFill").style.backgroundColor=score>0?"#0ecb81":"#f6465d";

  let aiColor=ai.signal=="BUY"?"#0ecb81":ai.signal=="SELL"?"#f6465d":"#fcd535";
  p("aiPredict").innerText="AI: "+ai.signal+" "+ai.prob.toFixed(0)+"%"; p("aiPredict").style.color=aiColor;

  // ===== TP/SL Trailing & Flash =====
  let lastBuy=tradesBuy[tradesBuy.length-1]||{entry:price,tp:price+atr*2,sl:price-atr};
  let lastSell=tradesSell[tradesSell.length-1]||{entry:price,tp:price-atr*2,sl:price+atr};

  if(tradesBuy.length>0 && price>lastBuy.entry){
    lastBuy.tp=Math.max(lastBuy.tp,price+atr*2);
    lastBuy.sl=Math.max(lastBuy.sl,price-atr);
    tradesBuy[tradesBuy.length-1] = lastBuy;
  }
  if(tradesSell.length>0 && price<lastSell.entry){
    lastSell.tp=Math.min(lastSell.tp,price-atr*2);
    lastSell.sl=Math.min(lastSell.sl,price+atr);
    tradesSell[tradesSell.length-1] = lastSell;
  }

  p("actionBuy").innerText="BUY"; p("actionBuy").style.color="#0ecb81";
  p("entryBuy").innerHTML="ENTRY: <span class='gray-number'>"+lastBuy.entry.toFixed(2)+"</span>";
  p("tpBuy").innerHTML="TP: <span class='gray-number'>"+lastBuy.tp.toFixed(2)+"</span>";
  p("slBuy").innerHTML="SL: <span class='gray-number'>"+lastBuy.sl.toFixed(2)+"</span>";
  if(price>=lastBuy.tp) flash(p("tpBuy"),'flash-price');
  if(price<=lastBuy.sl) flash(p("slBuy"),'flash-red');

  p("actionSell").innerText="SELL"; p("actionSell").style.color="#f6465d";
  p("entrySell").innerHTML="ENTRY: <span class='gray-number'>"+lastSell.entry.toFixed(2)+"</span>";
  p("tpSell").innerHTML="TP: <span class='gray-number'>"+lastSell.tp.toFixed(2)+"</span>";
  p("slSell").innerHTML="SL: <span class='gray-number'>"+lastSell.sl.toFixed(2)+"</span>";
  if(price<=lastSell.tp) flash(p("tpSell"),'flash-price');
  if(price>=lastSell.sl) flash(p("slSell"),'flash-red');

  // ===== Update WIN/LOSS History =====
  history.forEach(h=>{
    if(h.result=="-"){
      if(h.type=="BUY"){
        if(price>=h.tp) h.result="WIN";
        else if(price<=h.sl) h.result="LOSS";
      }
      else if(h.type=="SELL"){
        if(price<=h.tp) h.result="WIN";
        else if(price>=h.sl) h.result="LOSS";
      }
    }
  });

  // Mini chart + history
  let mc=p("miniChart"); mc.innerHTML=""; let recent=history.slice(-10);
  recent.forEach(h=>{let div=document.createElement("div"); div.className="mini-bar "+(h.type=="BUY"?"green":"red"); mc.appendChild(div);});
  p("total").innerText="Total Trades: "+history.length;
  let wins=history.filter(h=>h.result==="WIN").length;
  p("winrate").innerText="Winrate: "+(history.length?((wins/history.length)*100).toFixed(1)+"%":"-");
  p("last").innerText="Last: "+(history[history.length-1]?.type||"-");

  // Store trades
  if(score>15 && tradesBuy.length==0){tradesBuy.push({type:"BUY",entry:price,tp:lastBuy.tp,sl:lastBuy.sl,score}); history.push({type:"BUY",entry:price,tp:lastBuy.tp,sl:lastBuy.sl,result:"-"})}
  if(score<-15 && tradesSell.length==0){tradesSell.push({type:"SELL",entry:price,tp:lastSell.tp,sl:lastSell.sl,score}); history.push({type:"SELL",entry:price,tp:lastSell.tp,sl:lastSell.sl,result:"-"})}
}

// ===== Main Loop =====
async function run(){
  let d1=await getData("1m");
  let c1=closes(d1),v1=volumes(d1);
  let price=c1[c1.length-1],trend=price>MA(c1,15)?"UP 📈":"DOWN 📉";
  let rsi=RSI(c1),macd=MACD(c1),atr=ATR(d1),stoch=StochRSI(c1);
  let pattern=detectPattern(d1);
  let ai=aiPredict(c1);
  updateUI(price,trend,rsi,macd,atr,stoch,v1[v1.length-1],pattern,ai);
}
setInterval(run,1500);
run();
</script>
</body>
</html>
