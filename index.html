<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC AI LEVEL 3</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
html,body{margin:0;height:100%;background:#0b0e11;font-family:Arial;color:#ccc;}
.container{display:flex;height:100vh;}
#chart{flex:3;}
.right{flex:1;display:flex;flex-direction:column;padding:4px;gap:3px;}

.box{
height:28px;
background:#161a1e;
border-radius:6px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 8px;
font-size:13px;
}

.green{color:#0ecb81;font-weight:bold;}
.red{color:#f6465d;font-weight:bold;}
.yellow{color:#fcd535;}

.flash-up{background:#0ecb81;color:#000;}
.flash-down{background:#f6465d;color:#000;}
</style>
</head>

<body>

<div class="container">
<div id="chart"></div>

<div class="right">

<div class="box">
<span id="win" class="green">WIN:0</span>
<span id="loss" class="red">LOSS:0</span>
<span id="cur">CUR:0</span>
</div>

<div class="box"><span>PRICE</span><span id="price"></span></div>
<div class="box"><span>TREND</span><span id="trend"></span></div>
<div class="box"><span>RSI</span><span id="rsi"></span></div>
<div class="box"><span>ATR</span><span id="atr"></span></div>
<div class="box"><span>AI</span><span id="ai"></span></div>

<div class="box green"><span>TRADE</span><span id="status"></span></div>
<div class="box"><span>ENTRY</span><span id="entry"></span></div>
<div class="box green"><span>TP</span><span id="tp"></span></div>
<div class="box red"><span>SL</span><span id="sl"></span></div>

<div class="box" id="last">LAST: -</div>

</div>
</div>

<script>

// chart
new TradingView.widget({container_id:"chart",symbol:"BINANCE:BTCUSDT",interval:"1",theme:"dark",autosize:true});

// ===== FETCH =====
async function getData(tf){
let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=100`);
return await r.json();
}

function closes(d){return d.map(x=>+x[4]);}
function MA(d,n){return d.slice(-n).reduce((a,b)=>a+b)/n;}

function RSI(d){
let g=0,l=0;
for(let i=d.length-14;i<d.length;i++){
let x=d[i]-d[i-1];
if(x>0)g+=x; else l-=x;
}
return 100-(100/(1+g/l));
}

function ATR(d){
let t=[];
for(let i=1;i<d.length;i++){
let h=+d[i][2],l=+d[i][3],c=+d[i-1][4];
t.push(Math.max(h-l,Math.abs(h-c),Math.abs(l-c)));
}
return t.slice(-14).reduce((a,b)=>a+b)/14;
}

// ===== AI =====
let db=JSON.parse(localStorage.getItem("db")||"[]");

function save(t,ind){
db.push({...t,...ind});
if(db.length>500)db.shift();
localStorage.setItem("db",JSON.stringify(db));
}

function ai(ind){

if(db.length<30) return {s:"HOLD",p:0};

let sim=db.filter(h =>
Math.abs(h.rsi-ind.rsi)<5 &&
Math.abs(h.atr-ind.atr)<50 &&
h.trend==ind.trend
);

if(sim.length<5) return {s:"HOLD",p:30};

let win=sim.filter(x=>x.result=="WIN").length;
let p=win/sim.length*100;

return {
s: p>65?"BUY":p<35?"SELL":"HOLD",
p:p.toFixed(0),
n:sim.length
};
}

// ===== STATE =====
let trade=null,lastClosed=null,lastPrice=0;

// ===== UPDATE =====
function update(price,trend,rsi,atr,aiRes){

let p=id=>document.getElementById(id);

// price flash
if(lastPrice){
if(price>lastPrice){p("price").className="flash-up";}
else if(price<lastPrice){p("price").className="flash-down";}
}
lastPrice=price;

p("price").innerText=price.toFixed(2);
p("trend").innerText=trend;
p("rsi").innerText=rsi.toFixed(1);
p("atr").innerText=atr.toFixed(1);
p("ai").innerText=`${aiRes.s} ${aiRes.p}% (${aiRes.n||0})`;

// ===== ENTRY =====
if(!trade && aiRes.s!="HOLD"){
trade={
type:aiRes.s,
entry:price,
tp:aiRes.s=="BUY"?price+atr*2.5:price-atr*2.5,
sl:aiRes.s=="BUY"?price-atr:price+atr,
result:"OPEN"
};
}

// ===== TRAILING TP =====
if(trade && trade.result=="OPEN"){
if(trade.type=="BUY" && price>trade.entry){
trade.tp=Math.max(trade.tp, price+atr*2);
trade.sl=Math.max(trade.sl, price-atr);
}
if(trade.type=="SELL" && price<trade.entry){
trade.tp=Math.min(trade.tp, price-atr*2);
trade.sl=Math.min(trade.sl, price+atr);
}
}

// ===== CHECK =====
if(trade && trade.result=="OPEN"){

if((trade.type=="BUY" && price>=trade.tp)||
   (trade.type=="SELL" && price<=trade.tp)){
trade.result="WIN"; lastClosed=trade; save(trade,{rsi,atr,trend});
trade=null;
}

else if((trade.type=="BUY" && price<=trade.sl)||
        (trade.type=="SELL" && price>=trade.sl)){
trade.result="LOSS"; lastClosed=trade; save(trade,{rsi,atr,trend});
trade=null;
}
}

// UI
if(trade){
p("status").innerText=trade.type+" 🔥";
p("entry").innerText=trade.entry.toFixed(2);
p("tp").innerText=trade.tp.toFixed(2);
p("sl").innerText=trade.sl.toFixed(2);
}

// stats
let win=db.filter(x=>x.result=="WIN").length;
let loss=db.filter(x=>x.result=="LOSS").length;

p("win").innerText="WIN:"+win;
p("loss").innerText="LOSS:"+loss;
p("cur").innerText="CUR:"+(trade?1:0);

// last
if(lastClosed){
p("last").innerText=`${lastClosed.type} ${lastClosed.result}`;
p("last").className="box "+(lastClosed.result=="WIN"?"green":"red");
}

}

// ===== LOOP =====
async function run(){

let d1=await getData("1m");
let d5=await getData("5m");
let d15=await getData("15m");

let c1=closes(d1),c5=closes(d5),c15=closes(d15);

let price=c1[c1.length-1];

// multi trend
let trend1=price>MA(c1,15);
let trend5=price>MA(c5,15);
let trend15=price>MA(c15,15);

let trend=(trend1&&trend5&&trend15)?"UP":
(!trend1&&!trend5&&!trend15)?"DOWN":"SIDE";

let rsi=RSI(c1);
let atr=ATR(d1);

let aiRes=ai({rsi,atr,trend});

update(price,trend,rsi,atr,aiRes);

}

setInterval(run,2000);
run();

</script>
</body>
</html>
